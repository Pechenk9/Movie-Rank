<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Ranking Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/main.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="css/main.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
            },
            colors: {
              burgundy: {
                900: "#2B1D20",
                800: "#3D1B22",
                700: "#5C1D24",
                600: "#7A2831",
                500: "#9E323E",
                400: "#C24D5B",
              },
              muted: {
                bg: "#141418",
                card: "#1E1E24",
                cardLight: "#282832",
                border: "#383845",
                text: "#E2E2E6",
                subtext: "#9E9EA8",
              },
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="min-h-screen flex flex-col justify-between p-4 sm:p-6 lg:p-8 antialiased"
  >
    <header class="max-w-6xl w-full mx-auto text-center mb-6">
      <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-white mb-2">
        Movie <span class="text-burgundy-400">Ranker</span>
      </h1>
      <p class="text-sm text-muted-subtext">
        Ранжируйте выпадающие фильмы вслепую от 1 до N
      </p>
    </header>

    <main class="max-w-6xl w-full mx-auto flex-1 flex flex-col justify-center">
      <section
        id="setup-section"
        class="glass-panel p-6 sm:p-8 rounded-2xl max-w-xl w-full mx-auto shadow-2xl burgundy-glow"
      >
        <h2
          class="text-xl font-semibold text-white mb-6 border-b border-muted-border pb-3 flex items-center gap-2"
        >
          <svg
            class="w-5 h-5 text-burgundy-400"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
            ></path>
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
            ></path>
          </svg>
          Настройки Игры
        </h2>

        <form
          id="game-setup-form"
          onsubmit="handleStartGame(event)"
          class="space-y-5"
        >
          <div>
            <label
              class="block text-xs font-medium text-muted-subtext uppercase tracking-wider mb-2"
              >Игрок 1</label
            >
            <input
              type="text"
              id="player1-name"
              placeholder="Kirill"
              value="Kirill"
              class="w-full bg-muted-cardLight border border-muted-border rounded-xl px-4 py-3 text-white focus:outline-none focus:border-burgundy-500 transition"
            />
          </div>

          <div>
            <label
              class="block text-xs font-medium text-muted-subtext uppercase tracking-wider mb-2"
              >Игрок 2</label
            >
            <input
              type="text"
              id="player2-name"
              placeholder="Osman"
              value="Osman"
              class="w-full bg-muted-cardLight border border-muted-border rounded-xl px-4 py-3 text-white focus:outline-none focus:border-burgundy-500 transition"
            />
          </div>

          <div>
            <label
              class="block text-xs font-medium text-muted-subtext uppercase tracking-wider mb-2"
              >Количество уровней (Фильмов)</label
            >
            <select
              id="levels-count"
              class="w-full bg-muted-cardLight border border-muted-border rounded-xl px-4 py-3 text-white focus:outline-none focus:border-burgundy-500 transition"
            >
              <option value="5" selected>5 мест</option>
              <option value="7">7 мест</option>
              <option value="9">9 мест</option>
              <option value="15">15 мест</option>
              <option value="21">21 место</option>
            </select>
          </div>

          <div class="pt-2">
            <button
              type="submit"
              class="w-full bg-burgundy-700 hover:bg-burgundy-600 text-white font-medium py-3.5 px-6 rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2"
            >
              <span>Начать игру</span>
              <svg
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M14 5l7 7m0 0l-7 7m7-7H3"
                ></path>
              </svg>
            </button>
          </div>
        </form>
      </section>

      <section id="gameplay-section" class="hidden w-full">
        <!-- Mobile: Stacked, Desktop: Side-by-side -->
        <div
          id="gameplay-container"
          class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start"
        >
          <!-- Player 1 Board -->
          <div
            id="board-player-1"
            class="glass-panel p-5 sm:p-6 rounded-2xl transition-all duration-300"
          >
            <div
              class="flex justify-between items-center mb-4 border-b border-muted-border pb-3"
            >
              <h3
                id="p1-display-name"
                class="text-lg font-semibold text-white flex items-center gap-2"
              >
                <span
                  class="w-2.5 h-2.5 rounded-full bg-burgundy-500 inline-block"
                ></span>
                Player 1
              </h3>
              <span
                id="p1-progress-badge"
                class="text-xs bg-muted-cardLight text-muted-subtext px-3 py-1 rounded-full border border-muted-border"
                >0 / 5</span
              >
            </div>

            <div id="p1-active-area" class="mb-6 hidden">
              <!-- Current movie card -->
              <div
                class="bg-muted-cardLight border border-muted-border p-4 rounded-xl flex flex-col sm:flex-row items-center gap-4 shadow-md"
              >
                <img
                  id="p1-current-poster"
                  src=""
                  alt="Poster"
                  class="w-24 h-36 object-cover rounded-lg shadow-md border border-muted-border bg-muted-card flex-shrink-0"
                />
                <div class="text-center sm:text-left flex-1">
                  <span
                    class="text-xs text-burgundy-400 font-semibold uppercase tracking-wider"
                    >Текущий фильм</span
                  >
                  <h4
                    id="p1-current-title"
                    class="text-lg font-bold text-white mt-1 mb-3"
                  >
                    Loading...
                  </h4>
                  <button
                    id="p1-confirm-btn"
                    onclick="confirmPlacement(1)"
                    disabled
                    class="w-full sm:w-auto bg-burgundy-700 hover:bg-burgundy-600 disabled:opacity-40 disabled:hover:bg-burgundy-700 text-white text-sm font-medium py-2 px-5 rounded-lg transition"
                  >
                    Подтвердить выбор
                  </button>
                </div>
              </div>
            </div>

            <!-- Ranking List / Slots -->
            <div id="p1-slots-container" class="space-y-2">
              <!-- Slots injected dynamically -->
            </div>
          </div>

          <!-- Player 2 Board -->
          <div
            id="board-player-2"
            class="glass-panel p-5 sm:p-6 rounded-2xl transition-all duration-300 opacity-60"
          >
            <div
              class="flex justify-between items-center mb-4 border-b border-muted-border pb-3"
            >
              <h3
                id="p2-display-name"
                class="text-lg font-semibold text-white flex items-center gap-2"
              >
                <span
                  class="w-2.5 h-2.5 rounded-full bg-muted-subtext inline-block"
                ></span>
                Player 2
              </h3>
              <span
                id="p2-progress-badge"
                class="text-xs bg-muted-cardLight text-muted-subtext px-3 py-1 rounded-full border border-muted-border"
                >0 / 5</span
              >
            </div>

            <div id="p2-active-area" class="mb-6 hidden">
              <!-- Current movie card -->
              <div
                class="bg-muted-cardLight border border-muted-border p-4 rounded-xl flex flex-col sm:flex-row items-center gap-4 shadow-md"
              >
                <img
                  id="p2-current-poster"
                  src=""
                  alt="Poster"
                  class="w-24 h-36 object-cover rounded-lg shadow-md border border-muted-border bg-muted-card flex-shrink-0"
                />
                <div class="text-center sm:text-left flex-1">
                  <span
                    class="text-xs text-burgundy-400 font-semibold uppercase tracking-wider"
                    >Текущий фильм</span
                  >
                  <h4
                    id="p2-current-title"
                    class="text-lg font-bold text-white mt-1 mb-3"
                  >
                    Loading...
                  </h4>
                  <button
                    id="p2-confirm-btn"
                    onclick="confirmPlacement(2)"
                    disabled
                    class="w-full sm:w-auto bg-burgundy-700 hover:bg-burgundy-600 disabled:opacity-40 disabled:hover:bg-burgundy-700 text-white text-sm font-medium py-2 px-5 rounded-lg transition"
                  >
                    Подтвердить выбор
                  </button>
                </div>
              </div>
            </div>

            <!-- Ranking List / Slots -->
            <div id="p2-slots-container" class="space-y-2">
              <!-- Slots injected dynamically -->
            </div>
          </div>
        </div>
      </section>

      <section
        id="summary-section"
        class="hidden glass-panel p-6 sm:p-8 rounded-2xl max-w-4xl w-full mx-auto shadow-2xl burgundy-glow text-center"
      >
        <div class="mb-6">
          <span
            class="inline-block p-3 rounded-full bg-burgundy-900 border border-burgundy-600 mb-3 text-burgundy-400"
          >
            <svg
              class="w-8 h-8"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"
              ></path>
            </svg>
          </span>
          <h2 class="text-2xl font-bold text-white">Игра завершена!</h2>
          <p class="text-sm text-muted-subtext mt-1">
            Сравнение рейтингов игроков
          </p>
        </div>

        <div
          id="summary-comparison"
          class="grid grid-cols-1 md:grid-cols-2 gap-6 text-left"
        >
          <!-- Comparative results inserted dynamically -->
        </div>
      </section>
    </main>

    <footer
      class="max-w-6xl w-full mx-auto mt-8 text-center pt-4 border-t border-muted-border/40"
    >
      <button
        onclick="clearFullReset()"
        class="bg-muted-card hover:bg-burgundy-900/60 text-muted-subtext hover:text-white border border-muted-border px-5 py-2.5 rounded-xl text-xs tracking-wider uppercase transition flex items-center gap-2 mx-auto"
      >
        <svg
          class="w-3.5 h-3.5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
          ></path>
        </svg>
        <span>Полный сброс (Clear)</span>
      </button>
    </footer>
  </body>
</html>
